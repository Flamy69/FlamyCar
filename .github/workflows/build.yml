name: Build

# Every push to main is tested and built; the APK is attached to the workflow run.
# Pushing a tag like v1.2.3 additionally publishes it as a GitHub release.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Determine version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "ORG_GRADLE_PROJECT_appVersion=$version" >> "$GITHUB_ENV"
            echo "PACKAGE_NAME=FlamyCar-$version" >> "$GITHUB_ENV"
          else
            echo "PACKAGE_NAME=FlamyCar-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      # The signing key lives in repository secrets. Without it (forks, pull requests) the
      # build still works, but the APK is signed with a throwaway key.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "FLAMY_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key configured; this APK cannot update an installed release."
          fi

      - name: Test, lint and build
        env:
          FLAMY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLAMY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLAMY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # The tests draw the gauges with Android's own drawing code (Robolectric), which
        # fetches the Android runtime it needs on the first run.
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Name the package
        run: cp app/build/outputs/apk/release/app-release.apk "$PACKAGE_NAME.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: FlamyCar-apk
          path: FlamyCar-*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: FlamyCar-apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" FlamyCar-*.apk
          --repo "$GITHUB_REPOSITORY"
          --title "FlamyCar ${GITHUB_REF_NAME#v}"
          --generate-notes
